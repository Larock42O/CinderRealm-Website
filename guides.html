.guide .gbody { display: none; padding: 10px 4px; font-size: 13px; line-height: 1.7; color: #c9bd97; }
.guide.open .gbody { display: block; }
.guide .gbody b { color: var(--gold-hi); }
.guide .gbody ul { margin: 8px 0 8px 18px; }

</style>

    <h2>Newcomer Guides</h2>

      <p><i>Written by Jarvis, realm moderator. Click a guide to open it.</i></p>
      <div id="guides"></div>
    </div>
  </div>
</div>
<footer>
  <div><a href="https://cinderrealm.onrender.com" target="_blank" rel="noopener">Play Now</a><a href="forums.html">Forums</a><a href="rules.html">Rules</a></div>
  <div>Cinderrealm — World of Dunmere. An original fantasy MMORPG.</div>
</footer>
<script src="js/common.js"></script>
<script>
(function () {
  const GUIDES = [
    { t: "Your First Hour in Dunmere", b: `
      <p>Welcome, hero. You wake in <b>Emberhold</b> with Combat level 3, 25 coins, and a starter pack: bronze pickaxe, bronze axe, small net, tinderbox, and 10 bait.</p>
      <ul>
        <li><b>Move:</b> click anywhere on the ground to walk there. Right-click for interact options on people, objects, and monsters.</li>
        <li><b>Camera:</b> drag to rotate, scroll or pinch to zoom. The +/− buttons work too.</li>
        <li><b>First moves:</b> talk to the villagers in Emberhold — some hand out beginner tasks. Swing your axe at a tree (Logging), your pickaxe at rocks (Excavation), or cast your net at a fishing spot (Angling).</li>
        <li><b>Bank:</b> right-click the Bank Teller to store your goods. Your bank follows you across the realm.</li>
        <li><b>Staying alive:</b> the wilds around Emberhold are gentle, but venture far and the monsters bite back. Eat food (cook it first with Culinary) and run when outmatched.</li>
      </ul>` },
    { t: "Skills & Training — Where to Start", b: `
      <p>Dunmere has <b>21 skills</b>. You don't need to master them all at once — pick two or three that feed each other.</p>
      <ul>
        <li><b>Gatherer path:</b> Logging + Excavation + Angling. Low requirements, steady resources, everything sells.</li>
        <li><b>Warrior path:</b> Precision + Might + Resilience. Train on the rats and boars outside Emberhold before touching anything with teeth.</li>
        <li><b>Crafter path:</b> Metallurgy + Artisan + Essencecraft. Turn ores into bars, bars into gear, spark into runes.</li>
        <li><b>Level 20 comes fast</b> in every skill by design — the real climb starts after. Don't burn out grinding one thing; rotate.</li>
        <li><b>Skill capes:</b> reach 99 in any skill and its master will sell you the cape — proof you outlasted the grind.</li>
      </ul>` },
    { t: "Combat Basics — Don't Die", b: `
      <ul>
        <li><b>Gear tiers:</b> seven metals, weakest to strongest. Bronze is where everyone starts; white gold is the dream. Upgrade when you can afford it, not before.</li>
        <li><b>Know your foe:</b> check a monster's level before engaging. Anything more than a few levels above you is a gamble.</li>
        <li><b>Food is life:</b> cook what you catch or forage. Never delve a dungeon on an empty stomach.</li>
        <li><b>Weapon specials:</b> signature attacks like Cinder Slash and Ember Burst turn fights — learn when your weapon's special is ready and spend it wisely.</li>
        <li><b>The Outlands are PvP.</b> Everywhere else, monsters are the only thing trying to kill you. Cross into the northern ice and heroes become the predators. Don't carry what you can't lose.</li>
      </ul>` },
    { t: "Making Your First Coins", b: `
      <ul>
        <li><b>Gather and sell:</b> logs, ores, and fish always have buyers. It's slow, honest, and it works from level 1.</li>
        <li><b>The Tradekeep:</b> Dunmere's player market (Ironspire City and Sunfall). Check prices before you sell — the ledgers on this site show live offers when you're logged in. Buy low, sell high, mind the fees.</li>
        <li><b>Quests pay:</b> stories like <i>Embers of Dunmere</i> reward coins, XP, and gear. The quest journal is in your side panel.</li>
        <li><b>Don't beg, don't scam.</b> Both are against the Laws of the Realm and the Crown Guard has a long memory.</li>
      </ul>` },
    { t: "Teleports & Getting Around", b: `
      <ul>
        <li><b>Spellbook teleports</b> unlock as your Arcana rises — Whiteguard Keep, Emberhold, Mosswick, Thornhollow, Oasis, and Kilnmarch each have one. Bring the right runes.</li>
        <li><b>On foot</b> is free and you see the world. Dunmere rewards wanderers — new villages are always worth a look.</li>
        <li><b>Boats</b> will one day sail to the offshore isles. For now, admire Saltmere from the coast.</li>
      </ul>` },
  ];
  const box = document.getElementById('guides');
  box.innerHTML = GUIDES.map((g, i) =>
    '<div class="guide" id="g' + i + '"><h3><a data-g="' + i + '">📜 ' + Cinder.esc(g.t) + '</a></h3><div class="gbody">' + g.b + '</div></div>').join('');
  box.addEventListener('click', (e) => {
    const a = e.target.closest('[data-g]'); if (!a) return;
    document.getElementById('g' + a.dataset.g).classList.toggle('open');
  });
})();
</script>
</body>
</html>
